[workspace]
members = ["crates/engine", "crates/web-ui", "crates/app", "crates/plugin"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = "=0.3.106"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 1
