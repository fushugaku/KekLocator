<h1>KekLocator installed</h1>
<p>Open your DAW, rescan plug-ins and add <b>KekLocator</b> as an audio effect.</p>
<p>Enable <b>Source</b> and <b>Host</b>, then press <b>Play</b> in your DAW to run the internal sequencer. <b>Free</b> uses its own BPM.</p>
