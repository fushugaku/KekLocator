[package]
name = "keklocator-ui"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keklocator-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "Storage", "Node", "NodeList", "DomTokenList", "File", "FileList", "Blob", "CustomEvent", "CustomEventInit", "Navigator", "Performance", "console"] }
wasm-bindgen-futures = "=0.4.79"
